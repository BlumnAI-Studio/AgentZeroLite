<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The code view's Markdown preview. Offline by design: scripts only from this origin (the
     loopback asset server); pictures inline (the host turns workspace images into data URIs)
     or https (badges in a README). The document HTML comes from the host (Markdig, raw HTML
     escaped), so nothing in a file runs here. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #1e1e1e; color: #d4d4d4; }
  body { font: 14px/1.6 -apple-system, "Segoe UI", "Noto Sans KR", "Malgun Gothic", Helvetica, Arial, sans-serif; }
  #doc { max-width: 980px; padding: 18px 28px 48px; box-sizing: border-box; word-wrap: break-word; }
  h1, h2, h3, h4, h5, h6 { color: #e6edf3; margin: 1.4em 0 .6em; line-height: 1.25; font-weight: 600; }
  h1 { font-size: 1.9em; border-bottom: 1px solid #3c3c3c; padding-bottom: .3em; }
  h2 { font-size: 1.45em; border-bottom: 1px solid #3c3c3c; padding-bottom: .3em; }
  h3 { font-size: 1.2em; }
  a { color: #4fc1ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  p, ul, ol, table, pre, blockquote { margin: 0 0 1em; }
  code { font-family: "Cascadia Mono", Consolas, Menlo, monospace; font-size: .9em;
         background: #2d2d2d; border-radius: 4px; padding: .15em .4em; }
  pre { background: #252526; border: 1px solid #333; border-radius: 6px; padding: 12px 14px; overflow: auto; }
  pre code { background: none; padding: 0; font-size: .88em; line-height: 1.5; }
  blockquote { border-left: 4px solid #3794ff; color: #9da5b4; margin-left: 0; padding: .2em 1em; }
  table { border-collapse: collapse; display: block; overflow: auto; }
  th, td { border: 1px solid #3c3c3c; padding: 6px 12px; }
  th { background: #2a2d2e; color: #e6edf3; }
  tr:nth-child(2n) td { background: #232323; }
  img { max-width: 100%; }
  hr { border: 0; border-top: 1px solid #3c3c3c; margin: 1.5em 0; }
  li > input[type=checkbox] { margin-right: .4em; }
  /* A mermaid block before it is drawn, and when it fails: still readable as source. */
  pre.mermaid { background: #1e1e1e; border: 1px dashed #3c3c3c; text-align: center; }
  pre.mermaid[data-processed="true"] { border: 0; padding: 0; }
  .mermaid-error { color: #f14c4c; font-size: 12px; text-align: left; white-space: pre-wrap; }
</style>
<script src="mermaid.min.js"></script>
</head>
<body>
<div id="doc"></div>
<script src="preview.js"></script>
</body>
</html>
