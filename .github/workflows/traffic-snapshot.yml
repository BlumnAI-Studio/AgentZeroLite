name: Traffic Snapshot

# GitHub keeps traffic (views/clones) only for the trailing 14 days. This job
# snapshots them every day and merges them — keyed by date — into
# traffic-history/ so the long-term trend accumulates in-repo instead of
# evaporating.
#
# Release-download tracking was turned off on 2026-10-15. downloads.json and
# releases.json stay as the record up to 2026-10-13 and are no longer updated.

on:
  schedule:
    - cron: '0 18 * * *'   # 03:00 KST daily
  workflow_dispatch: {}      # manual run button

concurrency:
  group: traffic-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect + merge traffic (views/clones)
        env:
          # The Traffic API needs a PAT (TRAFFIC_TOKEN); the default GITHUB_TOKEN
          # gets 403 there. A PAT expires — the job then warns and records nothing.
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          mkdir -p traffic-history
          DATE=$(date -u +%F)

          # --- views + clones: require a PAT. If unavailable, warn and skip;
          #     recording resumes once TRAFFIC_TOKEN is valid again.
          if views_new=$(GH_TOKEN="$TRAFFIC_TOKEN" gh api "repos/$REPO/traffic/views" 2>/tmp/views.err); then
            [ -f traffic-history/views.json ] || echo '{}' > traffic-history/views.json
            jq --argjson new "$views_new" '
              reduce ($new.views[]?) as $v (.;
                .[$v.timestamp[0:10]] = {count: $v.count, uniques: $v.uniques})
            ' traffic-history/views.json > traffic-history/views.json.tmp
            mv traffic-history/views.json.tmp traffic-history/views.json

            clones_new=$(GH_TOKEN="$TRAFFIC_TOKEN" gh api "repos/$REPO/traffic/clones")
            [ -f traffic-history/clones.json ] || echo '{}' > traffic-history/clones.json
            jq --argjson new "$clones_new" '
              reduce ($new.clones[]?) as $c (.;
                .[$c.timestamp[0:10]] = {count: $c.count, uniques: $c.uniques})
            ' traffic-history/clones.json > traffic-history/clones.json.tmp
            mv traffic-history/clones.json.tmp traffic-history/clones.json
            echo "Traffic (views/clones) recorded."
          elif grep -q 'HTTP 401' /tmp/views.err; then
            # 401 = the token itself is dead (expired/revoked), not merely short of scope.
            echo "::error::TRAFFIC_TOKEN was rejected (HTTP 401 — expired or revoked). Re-issue the PAT and run: gh secret set TRAFFIC_TOKEN. Nothing recorded today."
          else
            echo "::warning::Traffic API not accessible with the current token ($(head -c 200 /tmp/views.err)). Add a TRAFFIC_TOKEN secret (classic PAT with 'repo' scope) to record views/clones. Nothing recorded today."
          fi

          # --- human-readable summary ---
          {
            echo "# Traffic History"
            echo ""
            echo "_Last snapshot: ${DATE} (UTC). Updated daily by \`.github/workflows/traffic-snapshot.yml\`._"
            echo ""
            echo "_Release-download tracking stopped on 2026-10-15; \`downloads.json\` and \`releases.json\` keep the counts as of 2026-10-13._"
            echo ""
            echo "## Views (all recorded days)"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            v_days=$( [ -f traffic-history/views.json ]  && jq 'length'                 traffic-history/views.json  || echo 0)
            v_sum=$(  [ -f traffic-history/views.json ]  && jq '[.[].count] | add // 0' traffic-history/views.json  || echo 0)
            c_days=$( [ -f traffic-history/clones.json ] && jq 'length'                 traffic-history/clones.json || echo 0)
            c_sum=$(  [ -f traffic-history/clones.json ] && jq '[.[].count] | add // 0' traffic-history/clones.json || echo 0)
            echo "| Recorded days (views) | ${v_days} |"
            echo "| Cumulative views | ${v_sum} |"
            echo "| Recorded days (clones) | ${c_days} |"
            echo "| Cumulative clones | ${c_sum} |"
          } > traffic-history/SUMMARY.md

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic-history/
          if git diff --cached --quiet; then
            echo "No traffic changes to commit."
          else
            git commit -m "chore(traffic): daily snapshot $(date -u +%F)"
            git push
          fi
